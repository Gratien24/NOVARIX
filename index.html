<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVARIX 0.8 — KCC Map Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7fa;font:15px Arial,sans-serif}header{padding:12px 16px;background:#172630;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:20px;margin:0;letter-spacing:2px}.tag{font-size:12px;color:#9ed6c3}#map{height:calc(100vh - 142px);min-height:420px;width:100%;background:#dce4dc}.panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#172630}.panel span{color:#d6e0e6}.btn{border:0;border-radius:7px;padding:9px 13px;background:#2c8c70;color:white;font-weight:bold;cursor:pointer}.btn.alt{background:#435563}.hint{font-size:12px;color:#c3d0d8}#status{font-weight:bold;color:#a8e7cf}.leaflet-popup-content{color:#18242a}.legend{background:#172630;padding:7px 10px;border-radius:6px;font-size:12px}
</style></head><body>
<header><div><h1>NOVARIX <span class="tag">v0.8 · KIGALI MAP BUILD</span></h1><div class="hint">Agace ka mbere: Kigali Convention Centre · Kimihurura</div></div><div id="status">Uri hafi ya KCC</div></header>
<div id="map" aria-label="Ikarita ya KCC"></div>
<div class="panel"><span><b>Controls:</b> WASD / Arrow keys = kugenda · E = kwinjira cyangwa gusohoka mu modoka</span><button class="btn" id="carBtn">Injira mu modoka (E)</button><button class="btn alt" id="centerBtn">Subira kuri KCC</button><span class="hint" id="mode">Uri kugenda n'amaguru</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const kcc=[-1.95543,30.09366];
const map=L.map('map',{zoomControl:true}).setView(kcc,17);
const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',noWrap:true,keepBuffer:2});
tiles.addTo(map);
tiles.on('tileerror',()=>{document.getElementById('status').textContent='Amashusho y’ikarita ntiyabonetse; reba internet cyangwa tile access';});
tiles.on('tileload',()=>{document.getElementById('status').textContent='Ikarita iri gukora · hafi ya KCC';});
const playerIcon=L.divIcon({className:'',html:'<div style="width:22px;height:22px;border:3px solid white;border-radius:50%;background:#1769ff;box-shadow:0 0 0 5px #1769ff55"></div>',iconSize:[22,22],iconAnchor:[11,11]});
const carIcon=L.divIcon({className:'',html:'<div style="font-size:25px;text-shadow:0 1px 3px #fff">🚙</div>',iconSize:[28,28],iconAnchor:[14,14]});
const personIcon=L.divIcon({className:'',html:'<div style="font-size:18px">🚶</div>',iconSize:[22,22],iconAnchor:[11,11]});
let pos=[kcc[0]+0.00045,kcc[1]-0.00035], inCar=false;
const player=L.marker(pos,{icon:playerIcon}).addTo(map).bindPopup('NOVARIX: Umukinnyi');
const car=L.marker([kcc[0]+0.00018,kcc[1]+0.00042],{icon:carIcon}).addTo(map).bindPopup('Imodoka ya NOVARIX');
L.marker(kcc).addTo(map).bindPopup('<b>Kigali Convention Centre</b><br>Kimihurura, Kigali, Rwanda').openPopup();
// Pedestrians are illustrative game characters, not a live count of real people.
[[.00025,.0001],[-.00018,.00052],[.0005,.0007],[-.0004,-.0002],[.00012,-.00065]].forEach(([a,b])=>L.marker([kcc[0]+a,kcc[1]+b],{icon:personIcon,interactive:false}).addTo(map));
function move(dx,dy){const speed=inCar?0.000075:0.000025;pos=[pos[0]+dy*speed,pos[1]+dx*speed];player.setLatLng(pos);if(inCar)car.setLatLng(pos);map.panTo(pos,{animate:true,duration:.18});document.getElementById('status').textContent='Aho uri: '+pos[0].toFixed(5)+', '+pos[1].toFixed(5)}
function toggleCar(){const d=map.distance(pos,car.getLatLng());if(!inCar&&d>100){document.getElementById('status').textContent='Egera imodoka mbere yo kuyinjiramo';return;}inCar=!inCar;document.getElementById('mode').textContent=inCar?'Utwaye imodoka':'Uri kugenda n’amaguru';document.getElementById('carBtn').textContent=inCar?'Sohoka mu modoka (E)':'Injira mu modoka (E)';if(inCar)car.setLatLng(pos);}
document.getElementById('carBtn').onclick=toggleCar;document.getElementById('centerBtn').onclick=()=>{pos=[kcc[0]+.00045,kcc[1]-.00035];player.setLatLng(pos);map.setView(kcc,17)};
const keys={w:[0,1],ArrowUp:[0,1],s:[0,-1],ArrowDown:[0,-1],a:[-1,0],ArrowLeft:[-1,0],d:[1,0],ArrowRight:[1,0]};
window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();move(...keys[e.key])}if(e.key.toLowerCase()==='e')toggleCar()});
</script></body></html>
